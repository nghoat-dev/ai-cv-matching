services:
  cv-matching-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_cv_matching_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./cv_matching.db
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
    volumes:
      - ./cv_matching.db:/app/cv_matching.db
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

